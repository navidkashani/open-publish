# Runs exactly what `npm run check` runs locally: typecheck, both test suites,
# then the bundle. Deliberately the same one command a contributor already uses,
# so CI and a local run cannot drift apart.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22.18+ strips TypeScript types from `.ts` imports without a flag,
      # which is what lets the test suites import `src/**/*.ts` directly with no
      # build step and no test-only toolchain. 24 is the floor we develop on.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      # Only the plugin gets an install, and all of its dependencies are
      # dev-only: the shipped plugin has no runtime dependencies at all. The
      # starter's tests and the gateway Worker's tests use nothing but Node
      # built-ins, and the gateway's typecheck borrows the plugin's `tsc`.
      - run: npm ci --prefix plugin

      - run: npm run check

  # The other half: the three build scripts run for real, against a fake bucket
  # and a real Quartz, asserting on the HTML that comes out.
  #
  # Separate from `check` because it clones a repository and installs it, so it
  # is slow and needs the network. Pull requests stay fast; this runs after a
  # merge, which is late enough to be useful and early enough to matter.
  #
  # It exists because leaving it to be run by hand meant it was not run. The
  # overlay build had been broken since the first commit, and nothing said so
  # until somebody typed `npm run verify` out of curiosity.
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No install step. The starter has no dependencies of its own, and the
      # build fetches Quartz and installs it inside a temporary directory.
      - run: npm run verify

  # The overlay lives here and the assembled template lives in another
  # repository, with nothing connecting them. That gap is how the template ran
  # six commits and one broken build behind without anyone noticing, and setup
  # step 3 points every new user straight at it.
  #
  # So: on any push that touches the overlay, compare the published template's
  # copy of each shipped file against this one. The file list is read out of
  # assemble.mjs rather than repeated here, because a second copy of the list is
  # the same failure one level up.
  template:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - id: touched
        run: |
          if git diff --quiet HEAD^ HEAD -- starters/quartz/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Only the tip tree is needed, and the template carries Quartz's full
      # history, so depth 1 keeps this to a couple of seconds.
      - if: steps.touched.outputs.changed == 'true'
        run: |
          git clone --quiet --depth 1 \
            https://github.com/navidkashani/open-publish-quartz.git /tmp/published

      - if: steps.touched.outputs.changed == 'true'
        run: |
          files=$(node -e "
            import('./starters/quartz/assemble.mjs')
              .then((m) => console.log(m.OVERLAY_FILES.join('\n')))
          ")
          drift=0
          while IFS= read -r file; do
            if ! diff -ruq "starters/quartz/$file" "/tmp/published/$file"; then
              drift=1
            fi
          done <<< "$files"
          if [ "$drift" -ne 0 ]; then
            echo
            echo "The published template no longer matches this overlay."
            echo "Re-assemble and push it:"
            echo
            echo "  node starters/quartz/assemble.mjs /tmp/op-quartz --ref v4.5.1 \\"
            echo "    --push git@github.com:navidkashani/open-publish-quartz.git"
            exit 1
          fi
          echo "The published template matches the overlay."
